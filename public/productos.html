<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos | Pastelería Aurora</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <div class="brand">
                <div class="brand-mark">A</div>
                <span>Pastelería Aurora</span>
            </div>
            <div class="nav-links">
                <a href="/index.html" data-page="index.html">Inicio</a>
                <a href="/productos.html" data-page="productos.html" class="active">Productos</a>
                <a href="/usuarios.html" data-page="usuarios.html">Usuarios</a>
                <a href="/historial.html" data-page="historial.html">Historial</a>
                <a href="/ventas.html" data-page="ventas.html">Ventas</a>
                <a href="/carrito.html" data-page="carrito.html" class="cart-pill">🛒 <span id="cartBadge"
                        class="badge">0</span></a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="section-header">
            <div>
                <h2>Productos</h2>
                <p class="subtle">Explora nuestro catálogo de postres artesanales</p>
            </div>
        </div>

        <div class="filter-row">
            <div class="field" style="flex:1; min-width: 260px;">
                <label for="searchInput">Buscar producto</label>
                <input id="searchInput" type="text" placeholder="Ej: tiramisú, cheesecake..." />
            </div>
        </div>

        <div class="grid" id="productosGrid"></div>
    </main>

    <script src="/app.js"></script>
</body>

</html>
